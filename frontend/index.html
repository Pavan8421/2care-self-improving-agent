<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinic Scheduling Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <header class="top">
        <div class="brand">
          <h1>Clinic Scheduling</h1>
          <p>Book, cancel, or reschedule with the appointment agent</p>
        </div>
        <div class="session-bar">
          <span id="session-label" class="session-label" title="Session id"></span>
          <button type="button" id="new-session" class="ghost">New session</button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <label class="sr-only" for="input">Message</label>
        <input
          id="input"
          type="text"
          placeholder="Message the scheduling agent…"
          autocomplete="off"
          required
        />
        <button type="submit" id="send">Send</button>
      </form>
      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
